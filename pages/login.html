<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="José Luis">
    <meta name="description" content="Acesse sua conta no Guia Anti-Golpe Digital.">

    <title>Entrar | Guia Anti-Golpe Digital</title>

    <link rel="stylesheet" href="../css/geral.css">

    <script src="../js/login.js" defer></script>
</head>

<body>

    <header>
        <h1>Guia Anti-Golpe Digital</h1>
        <p>Informação e prevenção contra golpes na internet.</p>
    </header>


    <main>
        <section>
            <h2>Entrar</h2>
            <p>
                Demonstração acadêmica: use o e-mail e a senha fictícios
                informados no cadastro neste navegador.
            </p>

            <form>
                <p>
                    <label for="email-login">E-mail</label>
                    <input type="email" id="email-login" name="email-login">
                </p>

                <p>
                    <label for="senha-login">Senha</label>
                    <input type="password" id="senha-login" name="senha-login">
                </p>

                <button type="button" id="botao-login">Entrar</button>
            </form>

            <p><a href="cadastro.html">Não tem uma conta? Cadastre-se</a></p>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - Guia Anti-Golpe Digital</p>
    </footer>

</body>

</html>
