<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="José Luis">
    <meta name="description" content="Crie uma conta no Guia Anti-Golpe Digital.">

    <title>Cadastro | Guia Anti-Golpe Digital</title>

    <link rel="stylesheet" href="../css/geral.css">
    <link rel="stylesheet" href="../css/login.css">

    <script src="../js/cadastro.js" defer></script>
</head>

<body>

    <header>
        <h1>Guia Anti-Golpe Digital</h1>
        <p>Informação e prevenção contra golpes na internet.</p>
    </header>


    <main>
        <section>
            <h2>Criar cadastro</h2>
            <p>
                Demonstração acadêmica: os dados ficam salvos somente neste navegador.
                Use informações fictícias, não dados reais.
            </p>

            <form>
                <p>
                    <label for="nome-cadastro">Nome</label>
                    <input type="text" id="nome-cadastro" name="nome-cadastro">
                </p>

                <p>
                    <label for="email-cadastro">E-mail</label>
                    <input type="email" id="email-cadastro" name="email-cadastro">
                </p>

                <p>
                    <label for="senha-cadastro">Senha</label>
                    <input type="password" id="senha-cadastro" name="senha-cadastro">
                </p>

                <button type="button" id="botao-cadastro">Criar cadastro</button>
            </form>

            <p><a href="login.html">Já possui cadastro? Faça login</a></p>
        </section>
    </main>

    <footer>
        <p>Projeto acadêmico - Guia Anti-Golpe Digital</p>
    </footer>

</body>

</html>
